name: Generate Datas

on:
  schedule: # Define de quanto em quanto tempo o robô vai rodar (aqui, a cada 12 horas)
    - cron: "0 */12 * * *"
  workflow_dispatch: # Adiciona um botão para podermos rodar o robô manualmente quando quisermos

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    steps:
      # Passo 1: O robô "baixa" o seu repositório para trabalhar nele
      - uses: actions/checkout@v3

      # Passo 2: O robô gera as imagens da cobrinha (uma clara e uma escura)
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Passo 3: O robô salva as imagens geradas em uma nova branch chamada "output"
      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
